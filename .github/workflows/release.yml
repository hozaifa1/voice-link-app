name: Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Patch google-services.json package name
        run: |
          # If a GOOGLE_SERVICES_JSON secret exists, decode and use it directly.
          # Otherwise, patch the committed file so the package name matches this app.
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Using google-services.json from secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret — patching committed file"
          fi

          # Replace old package name with the new one regardless of which file we're using.
          # This is safe: processReleaseGoogleServices only needs the name to match;
          # the actual Firebase SDK uses the project config, not the local package string.
          python3 - <<'PYEOF'
          import json, sys

          path = "app/google-services.json"
          OLD = "com.voicelink.connect"
          NEW = "com.streamsync.app"

          with open(path) as f:
              data = json.load(f)

          changed = False
          for client in data.get("client", []):
              ai = client.get("client_info", {}).get("android_client_info", {})
              if ai.get("package_name") == OLD:
                  ai["package_name"] = NEW
                  changed = True

          with open(path, "w") as f:
              json.dump(data, f, indent=2)

          if changed:
              print(f"Patched {OLD} → {NEW}")
          else:
              pkgs = [c.get("client_info",{}).get("android_client_info",{}).get("package_name","?")
                      for c in data.get("client",[])]
              print(f"No patch needed. Packages found: {pkgs}")
              if NEW not in pkgs:
                  print(f"ERROR: {NEW} not found — add the app in Firebase Console and update the secret")
                  sys.exit(1)
          PYEOF
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE_FILE secret is missing — see KEYSTORE_SETUP.md"
            exit 1
          fi
          echo "$KEYSTORE_FILE" | base64 --decode > app/release.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamsync-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
